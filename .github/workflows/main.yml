name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unpack & Auto-Configure Android Project
      run: |
        # 1. Zip file extract karein
        if [ -f "t999.zip" ]; then
          unzip -o t999.zip
        fi

        # 2. Agar project kisi andar wale folder mein hai to sab root par le aao
        BUILD_FILE=$(find . -name "settings.gradle*" -not -path "./settings.gradle*" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Moving files from $PROJECT_DIR to root"
          cp -rn "$PROJECT_DIR"/* . || true
        fi

        # 3. Signing config hatao (keystore missing error roknay ke liye)
        find . -name "*.gradle*" -exec sed -i '/signingConfig =/d' {} + || true

        # 4. Agar gradlew file na ho to khud banao
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x ./gradlew

    - name: Compile and Build APK
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Save and Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
        
