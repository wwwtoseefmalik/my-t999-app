name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Unpack, Prepare & Compile
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      run: |
        # 1. Zip extract karein
        mkdir -p extracted_project
        unzip -qo t999.zip -d extracted_project/

        # 2. Project root directory mein jayein
        BUILD_FILE=$(find extracted_project -name "settings.gradle*" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          cd "$(dirname "$BUILD_FILE")"
        else
          cd extracted_project
        fi

        # 3. .env file generate karein
        echo "GEMINI_API_KEY=dummy_key_for_build" > .env

        # 4. signingConfig remove karein
        find . -name "*.gradle*" -exec sed -i '/signingConfig =/d' {} + || true

        # 5. Fix Compose Compiler / Kotlin Mismatch
        find . -name "*.gradle*" -exec sed -i '/composeOptions {/,/}/d' {} + || true
        find . -name "*.gradle*" -exec sed -i 's/kotlinCompilerExtensionVersion.*/\/\/ removed/g' {} + || true

        # 6. Dummy google-services.json generate karein
        find . -type d -name "app" | while read -r app_dir; do
          cat << 'EOF' > "$app_dir/google-services.json"
        {
          "project_info": { "project_number": "1234567890", "project_id": "t999-app", "storage_bucket": "t999-app.appspot.com" },
          "client": [ { "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef", "android_client_info": { "package_name": "com.aistudio.t999.slots" } }, "api_key": [ { "current_key": "dummy_key" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ],
          "configuration_version": "1"
        }
        EOF
        done

        # 7. Clean Build chalayein
        gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
        
