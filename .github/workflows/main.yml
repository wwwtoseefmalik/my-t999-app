name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build T999 APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Get repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # AGP 9.1 requires JDK 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Gradle 9.3.1
      # ---------------------------------------------------------
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # ---------------------------------------------------------
      # 4. Restore the COMPLETE AI Studio project
      #
      # Your GitHub repository currently contains t999.zip,
      # while the gradle folder was not uploaded separately.
      # This restores the missing project files automatically.
      # ---------------------------------------------------------
      - name: Restore complete AI Studio project
        shell: bash
        run: |
          set -e

          if [ ! -f "t999.zip" ]; then
            echo "ERROR: t999.zip was not found in repository."
            echo "Please make sure t999.zip is in the repository root."
            exit 1
          fi

          rm -rf /tmp/t999_source
          mkdir -p /tmp/t999_source

          unzip -q -o t999.zip -d /tmp/t999_source

          echo "Restoring project files..."

          cp -R /tmp/t999_source/gradle .
          cp -f /tmp/t999_source/settings.gradle.kts .
          cp -f /tmp/t999_source/build.gradle.kts .
          cp -f /tmp/t999_source/gradle.properties .
          cp -f /tmp/t999_source/app/build.gradle.kts app/

          echo "Project restored."

          echo "Checking important files:"
          test -f gradle/libs.versions.toml
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle.kts

          echo "All required Gradle files are present."

      # ---------------------------------------------------------
      # 5. Fix Kotlin / AGP / KSP compatibility
      #
      # Original:
      # AGP    9.1.1
      # Kotlin 2.2.10
      # KSP    2.3.5
      #
      # Fixed:
      # AGP    9.1.0
      # Kotlin 2.4.10
      # KSP    2.3.10
      # ---------------------------------------------------------
      - name: Fix Gradle and Kotlin versions
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle/libs.versions.toml")
          s = p.read_text()

          replacements = {
              'agp = "9.1.1"': 'agp = "9.1.0"',
              'kotlin = "2.2.10"': 'kotlin = "2.4.10"',
              'googleDevtoolsKsp = "2.3.5"': 'googleDevtoolsKsp = "2.3.10"',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY

          echo "Final versions:"
          grep -E 'agp =|kotlin =|googleDevtoolsKsp =' gradle/libs.versions.toml

      # ---------------------------------------------------------
      # 6. Java source/target 17
      # ---------------------------------------------------------
      - name: Fix Java compatibility
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              "sourceCompatibility = JavaVersion.VERSION_11",
              "sourceCompatibility = JavaVersion.VERSION_17"
          )

          s = s.replace(
              "targetCompatibility = JavaVersion.VERSION_11",
              "targetCompatibility = JavaVersion.VERSION_17"
          )

          p.write_text(s)
          PY

          echo "Java compatibility:"
          grep -A4 "compileOptions" app/build.gradle.kts

      # ---------------------------------------------------------
      # 7. Create debug keystore
      # ---------------------------------------------------------
      - name: Create debug keystore
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f debug.keystore

      # ---------------------------------------------------------
      # 8. Build APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            :app:assembleDebug

      # ---------------------------------------------------------
      # 9. Show APK
      # ---------------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          echo "================================"
          echo "APK FILES"
          echo "================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # ---------------------------------------------------------
      # 10. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: T999-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
