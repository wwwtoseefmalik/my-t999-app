name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Project and Fix Dependencies
      run: |
        # 1. Zip file extract karein
        if [ -f "t999.zip" ]; then
          unzip -o t999.zip
        fi

        # 2. Files ko root par le aayein agar subfolder mein hon
        BUILD_FILE=$(find . -name "settings.gradle*" -not -path "./settings.gradle*" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cp -rn "$PROJECT_DIR"/* . || true
        fi

        # 3. Signing config remove karein
        find . -name "*.gradle*" -exec sed -i '/signingConfig =/d' {} + || true

        # 4. Dummy google-services.json generate karein
        find . -type d -name "src" | while read -r src_dir; do
          parent_dir=$(dirname "$src_dir")
          cat << 'EOF' > "$parent_dir/google-services.json"
        {
          "project_info": { "project_number": "1234567890", "project_id": "dummy-app", "storage_bucket": "dummy-app.appspot.com" },
          "client": [ { "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef", "android_client_info": { "package_name": "com.example.app" } }, "api_key": [ { "current_key": "dummy_api_key" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ],
          "configuration_version": "1"
        }
        EOF
        done

        # 5. Gradle wrapper check
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x ./gradlew

    - name: Compile APK (Headless Fix)
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true -Dkotlin.compiler.execution.strategy=in-process"
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Save APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
        
