name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle System
      uses: gradle/actions/setup-gradle@v3

    - name: Unpack, Patch & Build APK
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      run: |
        # 1. Clean Extraction
        rm -rf project_dir
        mkdir -p project_dir
        unzip -qo t999.zip -d project_dir/
        cd project_dir

        # 2. Setup Dummy .env Files
        echo "GEMINI_API_KEY=dummy_build_key" > .env
        echo "GEMINI_API_KEY=dummy_build_key" > .env.example

        # 3. Create dummy debug.keystore
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

        # 4. Generate Google Services JSON
        cat << 'EOF' > app/google-services.json
        {
          "project_info": { "project_number": "1234567890", "project_id": "t999-app", "storage_bucket": "t999-app.appspot.com" },
          "client": [ { "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef", "android_client_info": { "package_name": "com.aistudio.t999.slots" } }, "api_key": [ { "current_key": "dummy_key" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ],
          "configuration_version": "1"
        }
        EOF

        # 5. Fix SDK, Core KTX, and Stable Kotlin/KSP Versions
        sed -i 's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' app/build.gradle.kts
        sed -i 's/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts
        sed -i 's/coreKtx = "1.18.0"/coreKtx = "1.15.0"/g' gradle/libs.versions.toml
        sed -i 's/kotlin = "2.2.10"/kotlin = "2.0.21"/g' gradle/libs.versions.toml
        sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.0.21-1.0.28"/g' gradle/libs.versions.toml

        # 6. Global Gradle Build
        gradle assembleDebug -x test -x testDebugUnitTest --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
        
