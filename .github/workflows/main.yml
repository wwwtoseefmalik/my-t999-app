name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Project and Fix Dependencies
      run: |
        # 1. Extract zip
        if [ -f "t999.zip" ]; then
          unzip -o t999.zip
        fi

        # 2. Move files from subfolder if needed
        BUILD_FILE=$(find . -name "settings.gradle*" -not -path "./settings.gradle*" | head -n 1)
        if [ -n "$BUILD_FILE" ]; then
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cp -rn "$PROJECT_DIR"/* . || true
        fi

        # 3. Remove signing config
        find . -name "*.gradle*" -exec sed -i '/signingConfig =/d' {} + || true

        # 4. Generate Google Services json
        find . -type d -name "app" | while read -r app_dir; do
          cat << 'EOF' > "$app_dir/google-services.json"
        {
          "project_info": { "project_number": "1234567890", "project_id": "t999-app", "storage_bucket": "t999-app.appspot.com" },
          "client": [ { "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef", "android_client_info": { "package_name": "com.aistudio.t999.slots" } }, "api_key": [ { "current_key": "dummy_key" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ],
          "configuration_version": "1"
        }
        EOF
        done

        # 5. Fix Kotlin Compose Compiler Plugin version alignment
        find . -name "*.gradle*" -exec sed -i 's/1.9.24/2.0.21/g' {} + || true
        find . -name "libs.versions.toml" -exec sed -i 's/1.9.24/2.0.21/g' {} + || true

        # 6. Ensure wrapper execution permission
        chmod +x ./gradlew || true

    - name: Compile APK (Clean Build)
      run: |
        ./gradlew assembleDebug --no-daemon

    - name: Save APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
        
