name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Fix Kotlin / AGP / KSP versions
        shell: bash
        run: |
          set -e

          echo "Fixing Gradle versions..."

          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle/libs.versions.toml")
          s = p.read_text()

          s = s.replace('agp = "9.1.1"', 'agp = "9.1.0"')
          s = s.replace('kotlin = "2.2.10"', 'kotlin = "2.4.10"')
          s = s.replace('googleDevtoolsKsp = "2.3.5"', 'googleDevtoolsKsp = "2.3.10"')

          p.write_text(s)

          print("Versions fixed:")
          print("AGP   = 9.1.0")
          print("Kotlin = 2.4.10")
          print("KSP   = 2.3.10")
          PY

          echo "Checking versions:"
          grep -E 'agp =|kotlin =|googleDevtoolsKsp =' gradle/libs.versions.toml

      - name: Create debug keystore
        shell: bash
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradle executable
        run: chmod +x gradle 2>/dev/null || true

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle --version

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: T999-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
