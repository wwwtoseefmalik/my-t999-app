name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Clean Unpack & Direct Build
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      run: |
        # 1. Clean Extraction
        rm -rf app_source
        mkdir -p app_source
        unzip -qo *.zip -d app_source/
        cd app_source

        # 2. Enter exact root directory
        ROOT_DIR=$(dirname $(find . -name "settings.gradle*" | head -n 1))
        cd "$ROOT_DIR"

        # 3. Setup dummy .env files
        echo "GEMINI_API_KEY=dummy_build_key" > .env
        echo "GEMINI_API_KEY=dummy_build_key" > .env.example

        # 4. Generate debug keystore
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

        # 5. Fix Kotlin sourceSets rule
        echo "android.disallowKotlinSourceSets=false" >> gradle.properties

        # 6. Build debug APK directly
        gradle assembleDebug -x test -x testDebugUnitTest --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: error
        
